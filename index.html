<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Baú Lendário</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #scene {
            width: 100%; height: 100%;
            background: radial-gradient(circle, #1e3a8a 0%, #020617 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
        }

        /* Luzes Giratórias */
        .rays {
            position: absolute; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.2) 10%, transparent 20%);
            animation: rotate 10s linear infinite; opacity: 0; pointer-events: none;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Estrelas */
        .stars-container { position: absolute; top: 15%; display: flex; gap: 10px; }
        .star { width: 40px; height: 40px; opacity: 0.2; transition: 0.3s; }
        .star.active { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 10px gold); }

        /* Baú */
        #chest {
            width: 250px; height: 250px;
            background: url('chest_close.png') no-repeat center center;
            background-size: contain; z-index: 10; cursor: pointer;
        }
        #chest.open { background-image: url('chest_open.jpg'); }
        .shake { animation: shake 0.15s infinite; }
        @keyframes shake { 0% { transform: rotate(0); } 50% { transform: rotate(3deg); } 100% { transform: rotate(-3deg); } }

        /* Carta Personalizada */
        #card-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .card {
            width: 240px; height: 340px;
            background: #fff; border-radius: 15px;
            border: 6px solid #facc15;
            box-shadow: 0 0 30px #fff;
            text-align: center;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

        .card-img { width: 100%; height: 75%; object-fit: cover; border-bottom: 4px solid #facc15; }
        .card-text { padding: 10px; font-weight: bold; font-size: 20px; color: #333; }
    </style>
</head>
<body>

<div id="scene">
    <div class="rays" id="rays"></div>
    
    <div class="stars-container">
        <img src="https://vignette.wikia.nocookie.net/clashroyale/images/7/7c/Star_Level_3.png" class="star" id="s1">
        <img src="https://vignette.wikia.nocookie.net/clashroyale/images/7/7c/Star_Level_3.png" class="star" id="s2">
        <img src="https://vignette.wikia.nocookie.net/clashroyale/images/7/7c/Star_Level_3.png" class="star" id="s3">
    </div>

    <div id="chest"></div>

    <div id="card-overlay">
        <div class="card">
            <img src="sua_foto.png" class="card-img">
            <div class="card-text">NOVA CARTA LENDÁRIA!</div>
        </div>
    </div>
</div>

<audio id="snd-click" src="click.mp3"></audio>
<audio id="snd-open" src="open.mp3"></audio>
<audio id="snd-card" src="card.mp3"></audio>

<script>
    let clicks = 0;
    const chest = document.getElementById('chest');
    const rays = document.getElementById('rays');

    chest.addEventListener('click', () => {
        if (clicks < 3) {
            clicks++;
            document.getElementById('snd-click').play();
            document.getElementById(`s${clicks}`).classList.add('active');
            
            chest.classList.add('shake');
            setTimeout(() => chest.classList.remove('shake'), 150);

            if (clicks === 3) {
                setTimeout(openChest, 500);
            }
        }
    });

    function openChest() {
        document.getElementById('snd-open').play();
        chest.classList.add('open');
        rays.style.opacity = "1";
        
        setTimeout(() => {
            document.getElementById('snd-card').play();
            document.getElementById('card-overlay').style.display = 'flex';
        }, 1200);
    }

    // Reiniciar
    document.getElementById('card-overlay').onclick = () => location.reload();
</script>

</body>
</html>
