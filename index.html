<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baú Épico</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at center, #5a189a, #10002b);
    font-family: Arial, sans-serif;
    color:white;
    overflow:hidden;
}

.container{
    text-align:center;
    width:100%;
}

.chest{
    width:200px;
    height:150px;
    margin:auto;
    background:#c77dff;
    border-radius:18px;
    position:relative;
    cursor:pointer;
    box-shadow:0 0 50px #e0aaff;
}

.lid{
    width:100%;
    height:70px;
    background:#e0aaff;
    border-radius:18px 18px 0 0;
    position:absolute;
    top:0;
    transform-origin:bottom;
    transition:0.7s;
}

.chest.open .lid{
    transform:rotateX(-140deg);
}

.energy{
    position:absolute;
    inset:-20px;
    border-radius:30px;
    background: radial-gradient(circle, rgba(224,170,255,0.8), transparent 70%);
    opacity:0;
}

.chest.open .energy{
    opacity:1;
    animation:pulse 1.2s infinite alternate;
}

@keyframes pulse{
    from{ transform:scale(1); }
    to{ transform:scale(1.15); }
}

.star{
    font-size:42px;
    margin-top:10px;
    opacity:0;
    transform:translateY(30px);
    transition:0.5s;
}

.rarity{
    font-size:24px;
    color:#ff4dff;
    letter-spacing:2px;
    opacity:0;
    transition:0.5s;
}

.reward{
    margin-top:10px;
    opacity:0;
    transform:translateY(20px);
    transition:0.6s;
}

.reward img{
    width:140px;
    border-radius:12px;
    margin-top:10px;
    box-shadow:0 0 20px white;
}

button{
    margin-top:15px;
    padding:12px 26px;
    border:none;
    border-radius:12px;
    font-size:18px;
    background:#ffd60a;
    cursor:pointer;
    display:none;
}

.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0.8;
    animation:float 2s linear infinite;
}

@keyframes float{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-120px); opacity:0; }
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
}
</style>
</head>

<body>

<div class="container">

    <div class="chest" onclick="openChest(this)">
        <div class="energy"></div>
        <div class="lid"></div>
    </div>

    <div class="star" id="star">⭐</div>
    <div class="rarity" id="rarity">RARIDADE ÉPICA</div>

    <div class="reward" id="reward">
        <div id="text"></div>
        <img id="image" src="">
    </div>

    <button id="collect">COLETAR</button>

</div>

<audio id="sound" src="open.mp3"></audio>

<script>
const rewards = [
    {
        text:"Uma surpresa especial para você 💜",
        img:"foto1.jpg"
    },
    {
        text:"Mensagem secreta desbloqueada ✨",
        img:"foto2.jpg"
    },
    {
        text:"Você é incrível! 💫",
        img:"foto3.jpg"
    }
];

function createParticles(){
    for(let i=0;i<15;i++){
        const p=document.createElement("div");
        p.className="particle";
        p.style.left=(window.innerWidth/2 + (Math.random()*120-60))+"px";
        p.style.bottom="200px";
        p.style.animationDelay=Math.random()+"s";
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),2000);
    }
}

function openChest(chest){
    if(chest.classList.contains("open")) return;

    chest.classList.add("open");
    document.getElementById("sound").play();
    createParticles();

    setTimeout(()=>{
        document.getElementById("star").classList.add("show");
    },400);

    setTimeout(()=>{
        document.getElementById("rarity").classList.add("show");
    },700);

    setTimeout(()=>{
        const reward = rewards[Math.floor(Math.random()*rewards.length)];
        document.getElementById("text").innerText = reward.text;
        document.getElementById("image").src = reward.img;
        document.getElementById("reward").classList.add("show");
        document.getElementById("collect").style.display="inline-block";
    },1200);
}

document.getElementById("collect").onclick=()=>{
    alert("Recompensa enviada!");
};
</script>

</body>
</html>
