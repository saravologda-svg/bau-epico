<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Chest Opening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle, #facc15 0%, #ca8a04 100%);
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Arial Black', sans-serif;
        }

        /* Animação de Luz de Fundo (Glow) */
        .glow-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: rotate 10s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Tremor do Baú */
        .shake {
            animation: shake 0.2s ease-in-out infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 5px) rotate(2deg); }
            50% { transform: translate(-5px, 0px) rotate(-2deg); }
            75% { transform: translate(5px, -5px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Estilo das Cartas */
        .card-appear {
            animation: cardPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            perspective: 1000px;
        }

        @keyframes cardPop {
            0% { transform: scale(0) rotateY(90deg); opacity: 0; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        .legendary-border {
            border: 4px solid;
            border-image: linear-gradient(to bottom right, #ff00ea, #00d4ff, #00ff40, #ffff00) 1;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div class="glow-bg"></div>

    <div id="game-container" class="relative z-10 text-center w-full max-w-sm p-4">
        
        <div id="stars" class="flex justify-center mb-4 gap-1">
            <span class="text-3xl text-white opacity-20">★</span>
            <span class="text-3xl text-white opacity-20">★</span>
            <span class="text-3xl text-white opacity-20">★</span>
        </div>

        <div id="chest" class="relative mx-auto w-48 h-48 bg-purple-600 border-4 border-yellow-200 rounded-lg shadow-2xl flex items-center justify-center cursor-pointer transition-all duration-300">
            <span class="text-6xl text-white">?</span>
            <div class="absolute inset-0 bg-white opacity-0 transition-opacity duration-100" id="flash"></div>
        </div>

        <p id="instruction" class="mt-8 text-white font-bold text-xl drop-shadow-md uppercase italic">Toque para abrir!</p>

        <div id="card-display" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-6">
            <div id="card-inner" class="bg-white p-4 rounded-xl w-64 h-80 card-appear flex flex-col items-center justify-between border-8 border-purple-500">
                <div class="w-full h-40 bg-gray-200 rounded-lg flex items-center justify-center text-4xl" id="card-img">🛡️</div>
                <h2 id="card-title" class="text-2xl font-black text-gray-800 uppercase italic">PEKKA</h2>
                <p id="card-desc" class="text-sm text-gray-500">Dano massivo!</p>
            </div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const chest = document.getElementById('chest');
        const flash = document.getElementById('flash');
        const stars = document.querySelectorAll('#stars span');
        const cardDisplay = document.getElementById('card-display');
        const cardInner = document.getElementById('card-inner');

        const cards = [
            { name: "Exército de Esqueletos", icon: "💀", color: "border-purple-500", desc: "Muitos ossos!" },
            { name: "Príncipe", icon: "🏇", color: "border-purple-500", desc: "Carga total!" },
            { name: "MAGO ELÉTRICO", icon: "⚡", color: "legendary-border", desc: "ELETRIFICANTE!" }
        ];

        chest.addEventListener('click', () => {
            if (clickCount < 3) {
                // Efeito visual de clique
                clickCount++;
                chest.classList.add('shake');
                flash.style.opacity = "0.8";
                setTimeout(() => {
                    chest.classList.remove('shake');
                    flash.style.opacity = "0";
                }, 200);

                // Acender estrelas
                stars[clickCount - 1].classList.remove('opacity-20');
                stars[clickCount - 1].classList.add('text-yellow-400', 'scale-125');

                // Som (Simulado por vibração no iPhone)
                if (navigator.vibrate) navigator.vibrate(50);

                if (clickCount === 3) {
                    showCard();
                }
            }
        });

        function showCard() {
            setTimeout(() => {
                const data = cards[clickCount - 1]; // Pega a última carta
                document.getElementById('card-img').innerText = data.icon;
                document.getElementById('card-title').innerText = data.name;
                document.getElementById('card-desc').innerText = data.desc;
                
                if (data.color === "legendary-border") {
                    cardInner.className = "bg-white p-4 rounded-xl w-64 h-80 card-appear flex flex-col items-center justify-between " + data.color;
                } else {
                    cardInner.style.borderColor = "#a855f7"; // Roxo épico
                }

                cardDisplay.classList.remove('hidden');
                
                // Reiniciar após clique na carta
                cardDisplay.onclick = () => {
                    location.reload();
                };
            }, 500);
        }
    </script>
</body>
</html>
