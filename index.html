<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baú Épico</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at center, #5a189a, #10002b);
    font-family: Arial, sans-serif;
    color:white;
    overflow:hidden;
}

.container{
    text-align:center;
}

.chest{
    width:210px;
    height:160px;
    position:relative;
    margin:auto;
    cursor:pointer;
}

.base{
    width:100%;
    height:100%;
    background:linear-gradient(#a855f7,#7b2cbf);
    border-radius:18px;
    box-shadow:0 0 60px #c77dff;
    position:absolute;
}

.band{
    position:absolute;
    width:100%;
    height:20px;
    top:60px;
    background:#ffd60a;
}

.lock{
    width:50px;
    height:50px;
    background:#5a189a;
    border-radius:10px;
    position:absolute;
    left:50%;
    top:45px;
    transform:translateX(-50%);
    box-shadow:0 0 20px #ff4dff;
}

.lid{
    width:100%;
    height:70px;
    background:linear-gradient(#c77dff,#9d4edd);
    border-radius:18px 18px 0 0;
    position:absolute;
    top:0;
    transform-origin:bottom;
    transition:0.8s;
}

.chest.open .lid{
    transform:rotateX(-140deg);
}

.energy{
    position:absolute;
    inset:-20px;
    border-radius:30px;
    background: radial-gradient(circle, rgba(255,255,255,0.7), transparent 70%);
    opacity:0;
}

.chest.charging .energy{
    opacity:1;
    animation:pulse 0.6s infinite alternate;
}

@keyframes pulse{
    from{ transform:scale(1); }
    to{ transform:scale(1.15); }
}

.stars{
    margin-top:20px;
    font-size:28px;
    letter-spacing:8px;
    opacity:0;
    transition:0.6s;
}

.reward{
    margin-top:10px;
    opacity:0;
    transform:translateY(20px);
    transition:0.6s;
}

.reward img{
    width:150px;
    border-radius:12px;
    margin-top:10px;
    box-shadow:0 0 25px white;
}

.show{
    opacity:1 !important;
    transform:translateY(0) !important;
}

.click-info{
    margin-top:15px;
    font-size:18px;
    color:#e0aaff;
}
</style>
</head>

<body>

<div class="container">

    <div class="chest" id="chest">
        <div class="energy"></div>
        <div class="base"></div>
        <div class="band"></div>
        <div class="lock"></div>
        <div class="lid"></div>
    </div>

    <div class="click-info" id="info">Toque 3 vezes para abrir</div>

    <div class="stars" id="stars">
        ⭐ ⭐ ⭐ ⭐ ⭐
    </div>

    <div class="reward" id="reward">
        <div id="??????"></div>
        <img id="image" src="">
    </div>

</div>

<audio id="sound" src="open.mp3"></audio>

<script>
let clicks = 0;

const rewards = [
    {
        text:"Uma surpresa especial para você 💜",
        img:"foto1.jpg"
    },
    {
        text:"Mensagem secreta desbloqueada ✨",
        img:"foto2.jpg"
    },
    {
        text:"Você é incrível! 💫",
        img:"foto3.jpg"
    }
];

const chest = document.getElementById("chest");

chest.onclick = () => {
    if(chest.classList.contains("open")) return;

    clicks++;
    chest.classList.add("charging");

    document.getElementById("info").innerText =
        "Energia " + clicks + "/3";

    if(clicks >= 3){
        openChest();
    }
};

function openChest(){
    chest.classList.remove("charging");
    chest.classList.add("open");

    document.getElementById("sound").play();

    setTimeout(()=>{
        document.getElementById("stars").classList.add("show");
    },400);

    setTimeout(()=>{
        const reward = rewards[Math.floor(Math.random()*rewards.length)];
        document.getElementById("text").innerText = reward.text;
        document.getElementById("image").src = reward.img;
        document.getElementById("reward").classList.add("show");
    },900);
}
</script>

</body>
</html>
