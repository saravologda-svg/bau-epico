<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baú 5 Estrelas - Revelação Tripla</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Arial Black', sans-serif; background: #fde047; }
        #scene { width: 100%; height: 100%; background: radial-gradient(circle, #fef08a 0%, #ca8a04 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }

        /* Luzes Giratórias */
        .rays { position: absolute; width: 300%; height: 300%; background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.4) 10%, transparent 20%); animation: rotate 12s linear infinite; opacity: 0; pointer-events: none; z-index: 1; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 5 Estrelas (star.png) */
        .stars-container { position: absolute; top: 15%; display: flex; gap: 8px; z-index: 10; }
        .star { width: 35px; height: 35px; background: url('star.png') no-repeat center; background-size: contain; filter: brightness(0) opacity(0.2); transition: 0.3s; }
        .star.active { filter: brightness(1) opacity(1); transform: scale(1.3); filter: drop-shadow(0 0 10px white); }

        /* Baú (chest_close.png) */
        #chest { width: 250px; height: 250px; background: url('chest_close.png') no-repeat center center; background-size: contain; z-index: 5; cursor: pointer; }
        #chest.open { background-image: url('chest_open.png'); }
        .shake { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: rotate(0); } 50% { transform: rotate(3deg); } 100% { transform: rotate(-3deg); } }

        /* Overlay das Cartas */
        #card-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; flex-direction: column; }
        .card-container { width: 260px; height: 380px; perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; box-shadow: 0 0 30px #fff; }
        
        /* Verso e Frente */
        .card-back { background: url('card_back.png') no-repeat center; background-size: cover; border: 4px solid #fff; }
        .card-front { background: #fff; transform: rotateY(180deg); display: flex; flex-direction: column; overflow: hidden; border: 6px solid #a855f7; }
        .card-img { width: 100%; height: 75%; object-fit: cover; }
        .card-info { height: 25%; display: flex; align-items: center; justify-content: center; background: #eee; font-size: 20px; color: #333; font-weight: bold; padding: 5px; text-align: center; }
    </style>
</head>
<body>

<div id="scene">
    <div class="rays" id="rays"></div>
    <div class="stars-container">
        <div class="star" id="s1"></div><div class="star" id="s2"></div><div class="star" id="s3"></div><div class="star" id="s4"></div><div class="star" id="s5"></div>
    </div>
    <div id="chest"></div>

    <div id="card-overlay">
        <div class="card-container">
            <div class="card-inner" id="card-inner">
                <div class="card-face card-back"></div>
                <div class="card-face card-front">
                    <img id="display-img" src="" class="card-img">
                    <div id="display-text" class="card-info"></div>
                </div>
            </div>
        </div>
        <p style="color: white; margin-top: 20px;">clica clica</p>
    </div>
</div>

<audio id="snd-click" src="click.mp3"></audio>
<audio id="snd-open" src="open.mp3"></audio>
<audio id="snd-card" src="card.mp3"></audio>

<script>
    let clicks = 0;
    let currentCard = 0;
    const cards = [
        { img: 'foto1.png', text: 'PRIMEIRA CARTA!' },
        { img: 'foto2.png', text: 'SEGUNDA CARTA!' },
        { img: 'foto3.png', text: 'CARTA LENDÁRIA!' }
    ];

    const chest = document.getElementById('chest');
    const cardInner = document.getElementById('card-inner');

    chest.addEventListener('click', () => {
        if (clicks < 5) {
            clicks++;
            document.getElementById('snd-click').play().catch(()=>{});
            document.getElementById(`s${clicks}`).classList.add('active');
            chest.classList.add('shake');
            setTimeout(() => chest.classList.remove('shake'), 150);
            if (clicks === 5) setTimeout(openChest, 500);
        }
    });

    function openChest() {
        document.getElementById('snd-open').play().catch(()=>{});
        chest.classList.add('open');
        document.getElementById('rays').style.opacity = "1";
        setTimeout(showNextCard, 1200);
    }

    function showNextCard() {
        if (currentCard < cards.length) {
            const data = cards[currentCard];
            document.getElementById('display-img').src = data.img;
            document.getElementById('display-text').innerText = data.text;
            
            document.getElementById('card-overlay').style.display = 'flex';
            cardInner.classList.remove('flipped');
            document.getElementById('snd-card').play().catch(()=>{});

            setTimeout(() => cardInner.classList.add('flipped'), 300);
            currentCard++;
        } else {
            location.reload();
        }
    }

    cardInner.addEventListener('click', () => {
        document.getElementById('card-overlay').style.display = 'none';
        setTimeout(showNextCard, 300);
    });
</script>
</body>
</html>
