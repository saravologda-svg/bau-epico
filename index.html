<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baú Épico</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at center, #5a189a, #10002b);
    font-family: Arial, sans-serif;
    color:white;
    overflow:hidden;
}

.container{ text-align:center; }

.chest{
    width:220px;
    height:160px;
    position:relative;
    margin:auto;
    cursor:pointer;
}

.base{
    width:100%;
    height:100%;
    background:linear-gradient(#a855f7,#7b2cbf);
    border-radius:18px;
    box-shadow:0 0 60px #c77dff;
    position:absolute;
}

.band{
    position:absolute;
    width:100%;
    height:20px;
    top:60px;
    background:#ffd60a;
}

.lock{
    width:50px;
    height:50px;
    background:#5a189a;
    border-radius:10px;
    position:absolute;
    left:50%;
    top:45px;
    transform:translateX(-50%);
    box-shadow:0 0 20px #ff4dff;
}

.lid{
    width:100%;
    height:70px;
    background:linear-gradient(#c77dff,#9d4edd);
    border-radius:18px 18px 0 0;
    position:absolute;
    top:0;
    transform-origin:bottom;
    transition:0.8s;
}

.chest.open .lid{
    transform:rotateX(-140deg);
}

.energy{
    position:absolute;
    inset:-30px;
    border-radius:40px;
    background: radial-gradient(circle, white, transparent 70%);
    opacity:0;
}

.chest.charging .energy{
    opacity:1;
    animation:pulse 0.5s infinite alternate;
}

@keyframes pulse{
    from{ transform:scale(1); }
    to{ transform:scale(1.2); }
}

.explosion{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}

.explosion.show{
    animation:flash 0.6s forwards;
}

@keyframes flash{
    0%{opacity:0;}
    30%{opacity:1;}
    100%{opacity:0;}
}

.stars{
    margin-top:20px;
    font-size:28px;
    letter-spacing:8px;
    opacity:0;
}

.card{
    width:160px;
    height:200px;
    background:#7b2cbf;
    border-radius:14px;
    margin:20px auto;
    display:none;
    transform:rotateY(90deg);
    transition:0.6s;
    box-shadow:0 0 30px #fff;
    padding:10px;
}

.card.show{
    display:block;
    transform:rotateY(0);
}

.card img{
    width:100%;
    border-radius:10px;
}

.message{
    margin-top:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="explosion" id="explosion"></div>

<div class="container">

<div class="chest" id="chest">
    <div class="energy"></div>
    <div class="base"></div>
    <div class="band"></div>
    <div class="lock"></div>
    <div class="lid"></div>
</div>

<div id="info">Toque 3 vezes para abrir</div>

<div class="stars" id="stars">⭐ ⭐ ⭐ ⭐ ⭐</div>

<div class="card" id="card">
    <img id="cardImg" src="">
    <div class="message" id="cardText"></div>
</div>

</div>

<audio id="openSound" src="open.mp3"></audio>
<audio id="cardSound" src="reward.mp3"></audio>

<script>
let clicks=0;
let step=0;

const rewards=[
    {text:"Igor, está preparado? 💜", img:"foto1.jpg"},
    {text:"Você é muito especial ✨", img:"foto2.jpg"},
    {text:"Mensagem secreta desbloqueada 💫", img:"foto3.jpg"}
];

const chest=document.getElementById("chest");

chest.onclick=()=>{
    if(chest.classList.contains("open")) return;

    clicks++;
    chest.classList.add("charging");
    document.getElementById("info").innerText="Energia "+clicks+"/3";

    if(clicks>=3){
        openChest();
    }
};

function openChest(){
    chest.classList.remove("charging");
    chest.classList.add("open");

    document.getElementById("openSound").play();

    document.getElementById("explosion").classList.add("show");

    setTimeout(()=>{
        document.getElementById("stars").style.opacity=1;
        showNextReward();
    },600);
}

function showNextReward(){
    if(step>=rewards.length) return;

    const reward=rewards[step];

    document.getElementById("cardImg").src=reward.img;
    document.getElementById("cardText").innerText=reward.text;

    const card=document.getElementById("card");
    card.classList.remove("show");

    setTimeout(()=>{
        card.classList.add("show");
        document.getElementById("cardSound").play();
    },100);

    step++;

    setTimeout(showNextReward,2500);
}
</script>

</body>
</html>
